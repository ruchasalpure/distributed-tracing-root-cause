spec_version: "0.1.0"
name: distributed-tracing-root-cause
version: 1.0.0
description: Ingests high-throughput OpenTelemetry trace spans and correlates P99 latency anomalies directly to database locks, thread starvation, or downstream circuit breaker trips.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - trace-critical-path-analysis
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/distributed-tracing-root-cause"
